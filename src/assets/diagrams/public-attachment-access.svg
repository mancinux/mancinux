<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" role="img" aria-labelledby="title desc">
  <title id="title">How a public attachment request gets checked</title>
  <desc id="desc">The browser sends the sharing token and file ID to Operately. Operately checks that the document is still shared and available, and that the uploaded file belongs to that document and company. Failed checks return 404. If checks pass, Operately downloads the file from storage and streams its bytes to the browser. Disabling sharing clears the token, so future requests fail before reaching storage.</desc>
  <style>
    svg { background: #f3f0e9; color: #211e20; }
    .background { fill: #f3f0e9; }
    text { fill: currentColor; font-family: system-ui, sans-serif; font-size: 18px; }
    .small { font-size: 15px; }
    .label { font-size: 16px; fill: #746d71; }
    .box { fill: none; stroke: #aaa1a7; stroke-width: 1.5; }
    .check { fill: #e8b7aa; stroke: #c94b34; stroke-width: 1.5; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arrow); }
    @media (prefers-color-scheme: dark) {
      svg { background: #121014; color: #eee8df; }
      .background { fill: #121014; }
      .check { fill: #6b342d; stroke: #ff765a; }
      .label { fill: #aaa1a7; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M1 1 7 4 1 7" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect class="background" width="640" height="580"/>
  <text x="28" y="34" font-weight="600">each attachment request</text>
  <rect class="box" x="28" y="60" width="380" height="76" rx="8"/>
  <text x="48" y="91" font-weight="600">Browser requests a file</text>
  <text x="48" y="117" class="small">Sends the sharing token + file ID</text>
  <path class="arrow" d="M218 136 V182"/>
  <rect class="check" x="28" y="192" width="380" height="114" rx="8"/>
  <text x="48" y="223" font-weight="600">Operately checks access</text>
  <text x="48" y="250" class="small">Document still shared and available?</text>
  <text x="48" y="275" class="small">Uploaded file in this document + company?</text>
  <path class="arrow" d="M408 249 H460"/>
  <text x="421" y="234" class="label">fail</text>
  <rect class="box" x="470" y="215" width="142" height="68" rx="8"/>
  <text x="541" y="243" text-anchor="middle" font-weight="600">404</text>
  <text x="541" y="267" text-anchor="middle" class="small">Unavailable</text>
  <path class="arrow" d="M218 306 V357"/>
  <text x="234" y="337" class="label">pass</text>
  <rect class="box" x="28" y="367" width="380" height="60" rx="8"/>
  <text x="48" y="404">Download the file from storage</text>
  <path class="arrow" d="M218 427 V470"/>
  <rect class="box" x="28" y="480" width="380" height="60" rx="8"/>
  <text x="48" y="517">Stream bytes to the browser</text>
  <text x="28" y="567" class="label">Sharing off → token cleared → access check fails</text>
</svg>
